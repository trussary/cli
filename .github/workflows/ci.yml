name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The owner develops on Windows and users deploy from Linux; line endings
    # and path separators have to behave on both, so both run every time.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Check the packed size stays under 2 MB
        shell: bash
        run: |
          size=$(npm pack --dry-run --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].unpackedSize))")
          echo "unpacked: $size bytes"
          test "$size" -lt 2097152
